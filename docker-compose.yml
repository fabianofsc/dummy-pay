# PostgreSQL and DummyPay for local development and integration tests.
# docker compose up    → starts postgres + dummypay (builds the image)
# docker compose down  → stops everything
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dummypay
      POSTGRES_PASSWORD: dummypay
      POSTGRES_DB: dummypay
    ports:
      - "5432:5432"
    volumes:
      - dummypay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dummypay"]
      interval: 2s
      timeout: 2s
      retries: 15

  dummypay:
    build: .
    ports:
      - "8080:8080"
    environment:
      DUMMYPAY_HTTP_ADDR: ":8080"
      DUMMYPAY_DATABASE_URL: "postgres://dummypay:dummypay@postgres:5432/dummypay?sslmode=disable"
      DUMMYPAY_ACCOUNT_KEY_ID: "local-dev-account"
      DUMMYPAY_ACCOUNT_KEY_SECRET: "change-me-to-a-long-random-value"
      DUMMYPAY_WEBHOOK_SECRET_ENC_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      DUMMYPAY_PROCESSING_DELAY: "3s"
      DUMMYPAY_IDEMPOTENCY_LEASE: "30s"
      DUMMYPAY_WORKER_POLL_INTERVAL: "250ms"
      DUMMYPAY_WEBHOOK_TIMEOUT: "5s"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dummypay-postgres: